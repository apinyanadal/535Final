name: Deploy to GitHub Pages

# A push made by the nightly job's built-in token does not trigger other workflows,
# so this one also listens for the nightly to finish (same setup as 535Wheel).
concurrency:
  group: pages
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Nightly tracker"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # No ref on purpose: for workflow_run the default checkout is the newest commit on main,
        # which includes the data the nightly just pushed.
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
